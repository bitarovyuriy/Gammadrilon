# Конфигурация инструментов разработки. Проект не пакет: запуск — python main.py,
# сборка — build_release.ps1 (см. README, раздел «Запуск из исходников»).

[tool.ruff]
target-version = "py310"
line-length = 120
# Отладочные пробы в корне (_tmp_*.py) — личные инструменты автора, не код продукта.
extend-exclude = ["_tmp_*.py", "design"]

[tool.ruff.lint]
# Каждый набор включён осознанно: pyflakes и синтаксис (F/E9) обязаны быть чистыми
# всегда, остальное — включаем по мере разбора, а не «включим всё и заигнорим».
select = ["F", "E4", "E7", "E9", "W"]

[tool.ruff.lint.per-file-ignores]
# Тесты: assert — это их работа, а не забытый отладочный код.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: запускает окно в offscreen (нужен venv с PyQt5, включается GD_SMOKE=1)",
]
addopts = "-q"
