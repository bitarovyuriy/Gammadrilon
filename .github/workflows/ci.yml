name: Lite CI
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python build_lite.py
      - uses: actions/upload-artifact@v4
        with:
          name: Gammadrilon-Lite-portable
          path: |
            dist/monochrome/Gammadrilon-Lite-v*-portable.zip
            dist/monochrome/SHA256SUMS.txt
